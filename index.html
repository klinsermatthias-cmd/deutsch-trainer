<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deutsch Trainer">
<style>

/* Farben: Österreich (rot-weiß-rot). Variablennamen aus Opi suomea übernommen. */
:root{
  --lumi:#f6f5f3;      /* Schnee – Hintergrund */
  --paper:#ffffff;
  --sini:#c8102e;      /* Flaggenrot – Hauptfarbe */
  --sini-d:#a00d25;
  --yo:#1d2128;        /* Schrift */
  --jarvi:#fbecee;     /* zartes Rot */
  --muted:#5f6670;
  --line:#e3e1dd;
  --kuusi:#2e7d4f;     /* Almwiese – richtig */
  --kuusi-bg:#e7f3ec;
  --puolukka:#b42318;  /* falsch */
  --puolukka-bg:#fdecea;
  --lakka:#c77700;
  --lakka-bg:#fdf3e2;
  --lakka-ink:#9a5b00;
  --on-sini:#ffffff;
  --head:#c8102e;
  --ridge:rgba(255,255,255,.16);
  --next-bg:#2f3540;   /* Granit */
  --tip:#f3f1ec;
  --lock:#efeeec;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --lumi:#121417;--paper:#1b1e23;--sini:#ff5a6e;--sini-d:#ff7a8a;--yo:#e9eaec;--jarvi:#2a1c20;--muted:#a0a6ae;--line:#2c3037;
  --kuusi:#5cc48a;--kuusi-bg:#15291e;--puolukka:#ff7b72;--puolukka-bg:#3a1a1a;--lakka:#f0b050;--lakka-bg:#36290f;--lakka-ink:#f0b050;
  --on-sini:#1b0a0d;--head:#8e0b20;--ridge:rgba(255,255,255,.08);--next-bg:#262a31;--tip:#1f2329;--lock:#20242a;
  color-scheme:dark;
}
:root[data-theme="dark"] .fb.ok,:root[data-theme="dark"] .fb.bad,:root[data-theme="dark"] .fb.dunno{border-color:transparent}
:root[data-theme="dark"] .next .btn{background:#ff5a6e;color:#1b0a0d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--lumi);color:var(--yo);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f08a98;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Kopf: rot mit Alpenkamm */
header.top{background:var(--head);color:#fff;position:relative;overflow:hidden}
.top-inner{max-width:680px;margin:0 auto;padding:16px 18px 46px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:11px}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:#fff;opacity:.85;font-size:12.5px;font-weight:500;letter-spacing:0}
.sync{font-size:12px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.sync.err{background:var(--puolukka)}
.landscape{position:absolute;left:0;right:0;bottom:0;height:44px;z-index:1;display:block;width:100%}

main{max-width:680px;margin:0 auto;padding:18px 16px 28px}
.card{background:var(--paper);border-radius:14px;padding:18px;margin:0 0 14px;border:1px solid var(--line)}
.label{font-size:13px;color:var(--sini);font-weight:650;margin:0 0 4px}
h2{font-size:20px;margin:0 0 10px;letter-spacing:-.015em;line-height:1.25}
h3{font-size:16px;margin:20px 0 8px}
p{line-height:1.55;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
small{color:var(--muted)}

.btn{appearance:none;border:0;background:var(--sini);color:var(--on-sini);font-weight:650;font-size:15.5px;padding:13px 18px;border-radius:11px;cursor:pointer;width:100%;transition:transform .06s,background .15s}
.btn:hover{background:var(--sini-d)}
.btn:active{transform:scale(.985)}
.btn.sm{width:auto;padding:9px 15px;font-size:14px}
.btn.ghost{background:transparent;color:var(--sini);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--jarvi)}
.btn.danger{background:transparent;color:var(--puolukka);border:1.5px solid var(--puolukka-bg)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1;min-width:140px}

/* Heute */
.greet{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 2px;line-height:1.1}
.date{color:var(--muted);margin-bottom:16px}
.facts{display:flex;gap:22px;margin:0 0 18px;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column}
.facts b{font-size:22px;font-weight:800;color:var(--sini)}
.facts span{font-size:13px;color:var(--muted)}
.next{background:var(--next-bg);color:#fff;border-radius:16px;padding:20px;margin:0 0 14px}
.next .label{color:#f3b8c0}
.next h2{color:#fff;font-size:22px}
.next p{color:#dfe2e6}
.next .btn{background:var(--sini);color:#fff}
.next .btn:hover{background:var(--sini-d)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row b{display:block}
.teacher{border-left:4px solid var(--sini);background:var(--jarvi);border-radius:4px 14px 14px 4px;padding:14px 16px;margin:0 0 14px}
.teacher p{margin:0 0 6px}

/* Themenliste */
.tlist{list-style:none;margin:0;padding:0}
.titem{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.titem:hover{background:var(--jarvi)}
.titem .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--jarvi);color:var(--sini)}
.titem.locked{opacity:.5;cursor:default}
.titem.locked:hover{background:none}
.titem .body{flex:1;min-width:0}
.titem .fi{font-size:13px;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--kuusi)}
.badge{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--jarvi);color:var(--sini)}
.badge.due{background:var(--lakka-bg);color:var(--lakka-ink)}
.badge.new{background:var(--kuusi-bg);color:var(--kuusi)}
.badge.locked{background:var(--lock);color:var(--muted)}

/* Theorie */
.theory h3:first-child{margin-top:0}
.theory table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:15px}
.theory td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.theory td:first-child{font-weight:650;color:var(--sini);width:46%}
.theory .rule{background:var(--jarvi);border-left:3px solid var(--sini);padding:10px 12px;border-radius:3px 8px 8px 3px}
.theory .tip{background:var(--tip);border-left:3px solid #9a8f7a;padding:10px 12px;border-radius:3px 8px 8px 3px}
.theory ul{padding-left:20px;line-height:1.6}
.ftitle{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.05}
.back{background:none;border:0;color:var(--sini);font-weight:650;padding:4px 0;margin-bottom:10px;cursor:pointer}

/* Übungen */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sini);transition:width .3s}
.xbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
.ask{font-size:14px;color:var(--muted);margin-bottom:6px}
.q{font-size:24px;font-weight:750;letter-spacing:-.015em;line-height:1.3;margin:0 0 16px}
.q .gap{display:inline-block;min-width:56px;border-bottom:3px solid var(--sini);color:var(--sini)}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:13px 15px;border-radius:11px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px}
.opt:hover{border-color:var(--sini)}
.opt.right{border-color:var(--kuusi);background:var(--kuusi-bg)}
.opt.wrong{border-color:var(--puolukka);background:var(--puolukka-bg)}
.inp{width:100%;color:var(--yo);padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);font-size:17px;background:var(--paper)}
.inp:focus{border-color:var(--sini);outline:none}
.hint{font-size:14px;color:var(--muted);margin:-8px 0 12px}
.ordline{min-height:54px;border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.ph{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:16px;font-weight:600}
.chip.on{background:var(--jarvi);border-color:var(--sini);color:var(--sini)}
.chip.ghost{visibility:hidden}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px}
.fb.ok{background:var(--kuusi-bg);border:1px solid #bfdccd}
.fb.bad{background:var(--puolukka-bg);border:1px solid #efc2ca}
.fb.wait{background:var(--jarvi)}
.fb.dunno{background:var(--lakka-bg);border:1px solid #f0d7a8}
.fb.dunno b.t{color:var(--lakka-ink)}
.fb b.t{display:block;margin-bottom:4px;font-size:16px}
.fb.ok b.t{color:var(--kuusi)}
.fb.bad b.t{color:var(--puolukka)}
.fb p{margin:4px 0 0}

/* Ergebnis */
.center{text-align:center}
.ring{width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--sini) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;margin:10px auto 8px}
.ring span{width:100px;height:100px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--sini)}
.err{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.err .u{color:var(--puolukka)}
.err .r{color:var(--kuusi);font-weight:650}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media (max-width:440px){.rates{grid-template-columns:repeat(2,1fr)}}
.rate{border-radius:11px;padding:12px 6px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate b{font-size:15px}
.rate small{font-size:12px}
.rate.again b{color:var(--puolukka)} .rate.again:hover{background:var(--puolukka-bg)}
.rate.hard b{color:var(--lakka-ink)} .rate.hard:hover{background:var(--lakka-bg)}
.rate.good b{color:var(--sini)} .rate.good:hover{background:var(--jarvi)}
.rate.easy b{color:var(--kuusi)} .rate.easy:hover{background:var(--kuusi-bg)}
.aibox ul{padding-left:20px;margin:8px 0;line-height:1.55}
.plan{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--sini);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* Karteikarten */
.flash .front{font-size:36px;font-weight:800;letter-spacing:-.02em;text-align:center;padding:26px 0 18px;word-break:break-word}
.flash .backside{text-align:center;font-size:22px;font-weight:700;color:var(--sini);padding:4px 0 14px;border-top:1px dashed var(--line)}
.flash .backside small{display:block;font-size:14px;font-weight:500;margin-top:4px}
.cmp{font-size:14px;text-align:center;margin-bottom:10px}
.vrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.vrow .w{font-weight:650}
.vrow .d{color:var(--muted);flex:1;text-align:left;margin-left:10px}
.st{font-size:12px;font-weight:650;white-space:nowrap}
.st.neu{color:var(--muted)} .st.lernt{color:var(--lakka-ink)} .st.gut{color:var(--sini)} .st.sicher{color:var(--kuusi)}

/* Fortschritt */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--jarvi);border-radius:12px;padding:12px 14px}
.stat b{font-size:24px;font-weight:800;color:var(--sini);display:block}
.stat span{font-size:13px;color:var(--muted)}
.level{display:inline-block;font-size:26px;font-weight:800;color:var(--on-sini);background:var(--sini);border-radius:10px;padding:4px 12px;margin-right:8px}
textarea.out{width:100%;background:var(--paper);color:var(--yo);min-height:160px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
select.inp{padding:10px}
details summary{cursor:pointer;margin-top:4px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}

/* Audio */
.spk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--sini);cursor:pointer;vertical-align:middle;margin-right:8px;flex:none;padding:0}
.spk:hover{background:var(--jarvi);border-color:var(--sini)}
.spk svg{width:15px;height:15px;pointer-events:none}
.spk.big{width:52px;height:52px;margin:0 auto}
.spk.big svg{width:24px;height:24px}
.sayable{text-decoration:underline dotted var(--sini);text-underline-offset:3px;cursor:pointer}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:680px}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--muted)}
nav.tabs button b{font-size:12.5px;font-weight:700}
nav.tabs button small{font-size:10.5px}
nav.tabs button.on{color:var(--sini)}
nav.tabs svg{width:22px;height:22px}
#toast{position:fixed;border:1px solid rgba(255,255,255,.15);left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2f3540;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Einstufungstest (Placement test) */
.ptabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}
.ptab{flex:1;min-width:76px;border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:8px 6px;cursor:pointer;text-align:center}
.ptab b{display:block;font-size:15px}
.ptab small{font-size:12px}
.ptab.on{border-color:var(--sini);background:var(--jarvi);color:var(--sini)}
.ptab.full small{color:var(--kuusi);font-weight:700}
.psec h3{margin:0 0 4px}
.psec .code{color:var(--sini);margin-right:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.bank span{border:1px dashed var(--muted);padding:2px 10px;border-radius:99px;font-size:15px}
.pitem{display:grid;grid-template-columns:24px 1fr 34px;gap:8px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.pitem .n{color:var(--muted);font-size:14px;padding-top:6px}
.psent{font-size:17px;line-height:1.55;margin:0}
.psent.gaps{line-height:2.1}
.ptag{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);margin-left:6px;white-space:nowrap;vertical-align:2px}
input.pgap{font:inherit;font-size:17px;color:var(--sini);background:transparent;border:0;border-bottom:2px solid var(--muted);padding:0 2px;margin:0 2px;text-align:center;border-radius:0;width:8ch}
input.pgap:focus,textarea.pline:focus{outline:none;border-bottom-color:var(--sini);background:var(--jarvi)}
input.pgap.ok,.pw.ok{color:var(--kuusi);border-bottom-color:var(--kuusi)}
input.pgap.bad,.pw.bad{color:var(--puolukka);border-bottom-color:var(--puolukka)}
input.pgap[readonly]{cursor:default}
textarea.pline{display:block;width:100%;font:inherit;font-size:17px;line-height:1.5;color:var(--sini);background:transparent;border:0;border-bottom:2px solid var(--muted);border-radius:0;padding:4px 2px;resize:none;overflow:hidden}
textarea.plong{display:block;width:100%;font:inherit;font-size:16px;line-height:1.7;color:var(--yo);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:220px;resize:vertical}
textarea.pshort{min-height:96px}
.mine{font-size:17px;line-height:1.7;padding:4px 2px;border-bottom:2px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.pw.bad{text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:4px}
.unsure{width:32px;height:32px;border:1.5px solid var(--line);background:none;color:var(--muted);border-radius:50%;font-weight:800;cursor:pointer}
.unsure.on{background:var(--lakka);border-color:var(--lakka);color:#fff}
.unsure:disabled{cursor:default;opacity:.6}
.rfrow{display:flex;gap:8px;margin-top:6px}
.rfrow button{border:1.5px solid var(--line);background:var(--paper);padding:6px 14px;border-radius:9px;cursor:pointer;font-size:15px}
.rfrow button.on{background:var(--next-bg);border-color:var(--next-bg);color:#fff}
.rfrow button.ok{background:var(--kuusi);border-color:var(--kuusi);color:#fff}
.rfrow button.bad{background:var(--puolukka);border-color:var(--puolukka);color:#fff}
.rfrow button:disabled{cursor:default}
.pres{margin-top:8px;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--tip);border-left:4px solid var(--line)}
.pres.ok{border-left-color:var(--kuusi)} .pres.bad{border-left-color:var(--puolukka)} .pres.wait{border-left-color:var(--lakka)}
.pres .lbl{font-weight:750;margin-right:6px}
.pres.ok .lbl{color:var(--kuusi)} .pres.bad .lbl{color:var(--puolukka)} .pres.wait .lbl{color:var(--lakka-ink)}
.pres .sol b{color:var(--kuusi)}
.pres .sub{color:var(--muted);font-size:14px;margin-top:4px}
.pres .selfrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pres ul{margin:6px 0 0;padding-left:20px;line-height:1.5}
.wc{font-size:13px;color:var(--muted);margin-top:4px}
.wc.ok{color:var(--kuusi);font-weight:700}
.reading{background:var(--tip);border-left:4px solid var(--sini);border-radius:4px 12px 12px 4px;padding:14px 16px;line-height:1.7;margin:8px 0}
.reading p{margin:0 0 10px}.reading p:last-child{margin:0}
.checkrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.checkrow .btn{width:auto}
.keys{display:flex;gap:6px;margin:0 0 12px}
.keys button{width:38px;height:36px;border:1.5px solid var(--line);background:var(--paper);border-radius:9px;font-size:16px;cursor:pointer}
.pi-text{font-size:17px}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#fff"/><rect x="4" y="7" width="26" height="20" rx="2" fill="#c8102e"/><rect x="4" y="13.6" width="26" height="6.8" fill="#fff"/></svg>
      <div><h1>Deutsch Trainer</h1><small>Your German course with Coach</small></div>
    </div>
    <div id="sync" class="sync">Loading …</div>
  </div>
  <svg class="landscape" viewBox="0 0 1200 44" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path id="far" style="fill:var(--ridge)"/>
    <path id="near" style="fill:var(--lumi)"/>
  </svg>
</header>

const BASE_TOPICS = [];

/* ============================================================

let TOPICS = BASE_TOPICS.slice();
function rebuildTopics(){TOPICS=BASE_TOPICS.concat((S.packs||[]).filter(t=>!BASE_TOPICS.some(b=>b.id===t.id)))}
const KEY="deutsch-trainer-v1";
const APP="Deutsch Trainer";
const DAY=86400000;
const RATINGS=[{k:"again",q:1,l:"Again",de:"Nochmal"},{k:"hard",q:3,l:"Hard",de:"Schwer"},{k:"good",q:4,l:"Good",de:"Gut"},{k:"easy",q:5,l:"Easy",de:"Leicht"}];
const RQ={again:1,hard:3,good:4,easy:5};
let S=null, SESSION=null, CUR={tab:"today",arg:null}, GLOBAL_RUNNING=false;

const $=s=>document.querySelector(s);
const app=()=>document.getElementById("app");
const T=id=>TOPICS.find(t=>t.id===id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function todayKey(d=new Date()){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function startOfDay(t=Date.now()){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function endOfDay(t=Date.now()){const d=new Date(t);d.setHours(23,59,59,999);return d.getTime()}
function addDays(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime()}
function fmtDate(t){if(!t)return"–";return new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function relDays(t){const diff=Math.round((startOfDay(t)-startOfDay())/DAY);if(diff<=0)return"today";if(diff===1)return"tomorrow";return"in "+diff+" days"}
function pct(x){return x==null?"–":Math.round(x*100)+" %"}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clampInt(v,a,b){const n=parseInt(v,10);if(isNaN(n))return null;return Math.min(b,Math.max(a,n))}
function norm(s){return String(s||"").toLowerCase().replace(/[.,!?;:"“”„«»()]/g,"").replace(/[’']/g,"").replace(/\s+/g," ").trim()}
function loose(s){return norm(s).replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}
function dots(){return '<span class="dots"><i></i><i></i><i></i></span>'}

/* ============================================================
   ZUSTAND & SPEICHERUNG – sofort lokal + Cloud (Supabase)
   ============================================================ */
function defaultPlacement(){return{a:{},u:{},c:{},part:"A",started:0,done:false,doneAt:0,analysis:null}}
function defaultState(){return{v:2,created:Date.now(),updated:0,topics:{},cards:{},errors:[],reports:[],
  daily:{date:todayKey(),newCards:0,newTopics:0},stats:{streak:0,last:null,reviews:0,sessions:0},
  settings:{newCardsPerDay:16,newTopicsPerDay:2,ai:true,slow:false,autoplay:true,theme:"auto"},lastGlobal:0,sinceGlobal:0,active:null,lastBackup:0,packs:[],
  placement:defaultPlacement()}}
function migrate(){
  const d=defaultState();
  for(const k in d) if(S[k]===undefined) S[k]=d[k];
  S.settings={...d.settings,...S.settings}; S.stats={...d.stats,...S.stats};
  S.placement={...defaultPlacement(),...(S.placement||{})};
  rebuildTopics();
  TOPICS.forEach(t=>{ if(!S.topics[t.id]) S.topics[t.id]={status:"locked",ease:2.5,interval:0,reps:0,lapses:0,due:null,last:null,best:null,hist:[],ai:null}; });
  /* Vokabeln in beide Richtungen: alte Einzelkarte "t01-3" wird zu "t01-3-de" + "t01-3-en" (Fortschritt bleibt) */
  Object.keys(S.cards).forEach(id=>{
    if(/-(de|en)$/.test(id))return;
    const m=id.match(/^(.+)-(\d+)$/);if(!m)return;
    const c=S.cards[id];
    if(!S.cards[id+"-de"])S.cards[id+"-de"]={...c};
    if(!S.cards[id+"-en"])S.cards[id+"-en"]={...c};
    delete S.cards[id];
  });
  TOPICS.forEach(t=>{ if(S.topics[t.id].status==="learning") addCards(t); });
  if(S.daily.date!==todayKey()) S.daily={date:todayKey(),newCards:0,newTopics:0};
  refreshUnlocks();
}
function placementCount(x){const p=x&&x.placement;return p?Object.keys(p.a||{}).length+Object.keys(p.c||{}).length:0}
function hasProgress(x){return !!(x&&((x.stats&&x.stats.sessions)||Object.keys(x.cards||{}).length||placementCount(x)))}

/* --- Supabase (direkt über REST, ohne Zusatzbibliothek) --- */
/* Bereinigt die URL automatisch: alles nach ".supabase.co" wird entfernt (z. B. mitkopiertes /rest/v1/) */
function cleanSbUrl(u){
  u=String(u||"").trim();
  if(!/^https?:\/\//i.test(u)&&/\.supabase\.co/i.test(u))u="https://"+u;
  const m=u.match(/^(https?:\/\/[^\/\s?#]+?\.supabase\.co)/i);
  if(m)return m[1].replace(/^http:/i,"https:");
  return u.replace(/\/(rest|auth)\/v1.*$/i,"").replace(/[\/?#]+$/,"");
}
const sbBase=()=>cleanSbUrl(CFG.sbUrl);
async function authCall(kind,body){
  const res=await fetch(sbBase()+"/auth/v1/"+kind,{method:"POST",headers:{apikey:CFG.sbKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await res.json().catch(()=>({}));
  if(!res.ok){const e=new Error(j.error_description||j.msg||j.message||j.error||("HTTP "+res.status));e.status=res.status;throw e}
  return j;
}
function setSession(j){
  const old=CFG.session||{};
  CFG.session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Date.now()+(j.expires_in||3600)*1000,
    user:{id:(j.user&&j.user.id)||(old.user&&old.user.id),email:(j.user&&j.user.email)||(old.user&&old.user.email)}};
  saveCfg();
}
let REFRESHING=null;
async function ensureToken(force){
  if(!force&&CFG.session.expires_at-60000>Date.now())return;
  if(!REFRESHING)REFRESHING=authCall("token?grant_type=refresh_token",{refresh_token:CFG.session.refresh_token})
    .then(setSession)
    .catch(e=>{if(e.status>=400&&e.status<500){CFG.session=null;saveCfg();setSync("login");toast("Please sign in again under Progress → Cloud & AI")}throw e})
    .finally(()=>{REFRESHING=null});
  await REFRESHING;
}
async function sbFetch(path,opt={},retried){
  await ensureToken();
  const res=await fetch(sbBase()+path,{...opt,headers:{apikey:CFG.sbKey,Authorization:"Bearer "+CFG.session.access_token,"Content-Type":"application/json",...(opt.headers||{})}});
  if(res.status===401&&!retried){await ensureToken(true);return sbFetch(path,opt,true)}
  if(!res.ok)throw new Error("HTTP "+res.status);
  const t=await res.text();return t?JSON.parse(t):null;
}
async function pushCloud(keepalive){
  PUSH_TIMER=null;if(!cloudOn()||!DIRTY)return;
  if(!navigator.onLine){setSync("offline");return}
  const upd=S.updated;
  try{
    await sbFetch("/rest/v1/progress?on_conflict=user_id",{method:"POST",keepalive:!!keepalive,
      headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({user_id:uid(),data:S,updated_at:new Date(upd).toISOString()})});
    if(S.updated===upd)DIRTY=false;
    setSync(DIRTY?"saving":"ok");
    cloudSnapshot().catch(()=>{});
  }catch(e){if(cloudOn())setSync(navigator.onLine?"err":"offline")}
}
/* Täglicher Stand in der Cloud – die letzten 30 Tage bleiben erhalten */
async function cloudSnapshot(){
  const d=todayKey();if(CFG.lastSnapDay===d||!hasProgress(S))return;
  await sbFetch("/rest/v1/snapshots?on_conflict=user_id,day",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify({user_id:uid(),day:d,data:S})});
  const old=new Date();old.setDate(old.getDate()-30);
  await sbFetch(`/rest/v1/snapshots?user_id=eq.${uid()}&day=lt.${todayKey(old)}`,{method:"DELETE",headers:{Prefer:"return=minimal"}});
  CFG.lastSnapDay=d;saveCfg();
}
async function fetchRemote(){const rows=await sbFetch(`/rest/v1/progress?select=data&user_id=eq.${uid()}`);return rows&&rows[0]?rows[0].data:null}
/* Holt den neueren Stand aus der Cloud. Rückgabe true = lokaler Stand wurde ersetzt */
async function pullCloud(){
  if(!cloudOn()||!navigator.onLine){if(cloudOn())setSync("offline");return false}
  try{
    const remote=await fetchRemote();
    if(!remote){if(hasProgress(S)){DIRTY=true;pushCloud()}else setSync("ok");return false}
    if((remote.updated||0)>(S.updated||0)&&!SESSION&&!PT_BUSY.size){
      if(hasProgress(S))localStorage.setItem(KEY+"-before-sync",JSON.stringify(S));
      S=remote;migrate();writeLocal();applyTheme();DIRTY=false;setSync("ok");return true}
    if((remote.updated||0)<(S.updated||0)){DIRTY=true;pushCloud()}else setSync("ok");
    return false;
  }catch(e){if(cloudOn())setSync(navigator.onLine?"err":"offline");return false}
}
/* Erste Verbindung eines Geräts: nie einen echten Fortschritt überschreiben */
async function firstLink(){
  const remote=await fetchRemote();
  const score=x=>x?((x.stats&&x.stats.sessions)||0)*10+((x.stats&&x.stats.reviews)||0)+placementCount(x):0;
  if(remote&&hasProgress(remote)&&score(remote)>=score(S)){
    if(hasProgress(S)){localStorage.setItem(KEY+"-before-sync",JSON.stringify(S));dl(JSON.stringify(S),"deutsch-trainer-device-before.json","application/json")}
    S=remote;migrate();writeLocal();applyTheme();DIRTY=false;setSync("ok");return"remote";
  }
  if(remote&&hasProgress(remote))dl(JSON.stringify(remote),"deutsch-trainer-cloud-before.json","application/json");
  DIRTY=true;await pushCloud();return"local";
}

/* ============================================================
   SPACED REPETITION (SM-2, wie Anki)
   Vokabelkarten: zwei Karten pro Wort, jede mit eigenem Plan
   "<topic>-<index>-de"  Deutsch sehen → Englisch wissen
   "<topic>-<index>-en"  Englisch sehen → Deutsch wissen
   ============================================================ */
function sm2Next(it,q){
  let ease=it.ease??2.5, reps=it.reps??0, interval=it.interval??0, lapses=it.lapses??0;
  if(q<3){reps=0;interval=0;lapses++;ease=Math.max(1.3,ease-0.2);}
  else{
    if(reps===0) interval={3:1,4:1,5:3}[q];
    else if(reps===1) interval={3:2,4:4,5:7}[q];
    else{const f=q===3?1.2:q===4?ease:ease*1.3;interval=Math.max(interval+1,Math.round(interval*f));}
    ease=Math.max(1.3,ease+(0.1-(5-q)*(0.08+(5-q)*0.02)));
    reps++;
  }
  return{ease,reps,interval,lapses};
}
function prereqMet(t){return t.req.every(r=>{const s=S.topics[r];return s&&s.last!=null&&s.last>=0.8})}
function refreshUnlocks(){const opened=[];TOPICS.forEach(t=>{const s=S.topics[t.id];if(s.status==="locked"&&prereqMet(t)){s.status="new";opened.push(t)}});return opened}
const newCard=()=>({ease:2.5,interval:0,reps:0,lapses:0,due:null,isNew:true});
function addCards(t){t.v.forEach((w,i)=>{["de","en"].forEach(d=>{const id=t.id+"-"+i+"-"+d;if(!S.cards[id])S.cards[id]=newCard()})})}
function cardParts(id){const m=String(id).match(/^(.+)-(\d+)-(de|en)$/);return m?{tid:m[1],i:+m[2],dir:m[3]}:null}
function cardWord(id){const p=cardParts(id);if(!p)return null;const t=T(p.tid);return t?t.v[p.i]:null}
function cardDir(id){const p=cardParts(id);return p?p.dir:"de"}
function dueTopics(){return TOPICS.filter(t=>{const s=S.topics[t.id];return s.status==="learning"&&s.due&&s.due<=endOfDay()}).sort((a,b)=>S.topics[a.id].due-S.topics[b.id].due)}
function nextNewTopic(){return TOPICS.find(t=>S.topics[t.id].status==="new")}
function dueCards(){const now=Date.now();return Object.keys(S.cards).filter(id=>{const c=S.cards[id];return !c.isNew&&c.due&&c.due<=now&&cardWord(id)})}
function allNewCardIds(){const ids=[];TOPICS.forEach(t=>t.v.forEach((w,i)=>["de","en"].forEach(d=>{const id=t.id+"-"+i+"-"+d;if(S.cards[id]&&S.cards[id].isNew)ids.push(id)})));return ids}
function newCardsAvail(){const left=Math.max(0,S.settings.newCardsPerDay-S.daily.newCards);return allNewCardIds().slice(0,left)}
function cardState(c){if(c.isNew)return"new";if(c.interval>=21)return"solid";if(c.interval>=4)return"good";return"learning"}
function wordKey(id){const p=cardParts(id);return p?p.tid+"-"+p.i:id}
function learnedWords(){const s=new Set();Object.entries(S.cards).forEach(([id,c])=>{if(!c.isNew&&cardWord(id))s.add(wordKey(id))});return s.size}
function solidWords(){const by={};Object.entries(S.cards).forEach(([id,c])=>{if(!cardWord(id))return;const k=wordKey(id);by[k]=by[k]||[];by[k].push(c)});return Object.values(by).filter(cs=>cs.length===2&&cs.every(c=>!c.isNew&&c.interval>=21)).length}
function masteredTopics(){return TOPICS.filter(t=>(S.topics[t.id].last||0)>=0.8).length}
function weakCards(){return Object.entries(S.cards).filter(([id,c])=>!c.isNew&&cardWord(id)&&(c.lapses>=2||c.ease<2.0)).sort((a,b)=>b[1].lapses-a[1].lapses)}
function streakNow(){const y=todayKey(new Date(Date.now()-DAY));return(S.stats.last===todayKey()||S.stats.last===y)?S.stats.streak:0}
function bumpStreak(){const tk=todayKey();if(S.stats.last===tk)return;const y=todayKey(new Date(Date.now()-DAY));S.stats.streak=S.stats.last===y?S.stats.streak+1:1;S.stats.last=tk}
function ivLabel(n){return n<1?"1 min":n===1?"1 day":n+" days"}

/* ============================================================
   KI – COACH (spricht Englisch, beurteilt deutsche Antworten)
   ============================================================ */
const TEACHER="You are \"Coach\", a patient, honest and encouraging German teacher based in Austria. Your student is Aurora, who is at B1 level and working towards B2. She lives and works in Austria, so everyday life in Austria matters (authorities, doctor, shopping, flat, small talk, phone calls, understanding a bit of dialect). Always explain in clear, simple English. German examples must always be correct. Prefer Austrian standard German (e.g. Jänner, Paradeiser, Grüß Gott, Servus) and mention the German-German word where useful (e.g. \"Paradeiser (Germany: Tomate)\"). Her known weak spots are pronouns, tenses and cases.";
const SYS_JSON=TEACHER+" Reply ONLY with valid JSON – no text before or after, no Markdown. All explanations, feedback and tips must be in ENGLISH; only German example words or sentences stay German.";
/* KI-Anbieter: Google Gemini (kostenlos) oder ein OpenAI-kompatibler Dienst.
   Bei Überlastung (503) oder Limit/Fehler (429/500) wird automatisch das nächste Modell probiert. */
const GEMINI_MODELS=["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-flash-latest","gemini-flash-lite-latest"];
function aiReady(){const a=CFG.ai||{};return !!(S&&S.settings.ai&&a.provider&&a.provider!=="none"&&a.key)}
async function claude(system,user){
  const a=CFG.ai||{};
  if(!a.key||!a.provider||a.provider==="none")throw new Error("AI not set up");
  return a.provider==="openai"?openaiCall(system,user,a):geminiCall(system,user,a);
}
async function geminiCall(system,user,a){
  const models=[a.model,...GEMINI_MODELS].filter((m,i,arr)=>m&&arr.indexOf(m)===i);
  let last=null;
  for(const m of models){
    let res;
    try{
      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{
        method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":a.key},
        body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:user}]}],generationConfig:{temperature:0.3,maxOutputTokens:4096}})});
    }catch(e){last=new Error("No connection");continue}
    if(res.status===404){last=new Error("Model "+m+" not available");continue}
    if(res.status===503||res.status===500||res.status===429){last=new Error(res.status===429?"Rate limit reached – wait a moment":"Gemini is busy right now ("+res.status+")");continue}
    if(res.status===400||res.status===403){const j=await res.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||"Invalid key")}
    if(!res.ok){last=new Error("HTTP "+res.status);continue}
    const d=await res.json();
    const txt=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||"").join("").trim();
    if(!txt){last=new Error("Empty answer");continue}
    if(a.model&&a.model!==m){/* gespeichertes Modell bleibt; nur das automatische Ausweichen merken */}
    CFG.ai.lastModel=m;saveCfg();
    return txt;
  }
  throw last||new Error("No model available");
}
async function openaiCall(system,user,a){
  const res=await fetch((a.baseUrl||"https://api.groq.com/openai/v1").replace(/\/+$/,"")+"/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json",Authorization:"Bearer "+a.key},
    body:JSON.stringify({model:a.model||"llama-3.3-70b-versatile",temperature:0.3,messages:[{role:"system",content:system},{role:"user",content:user}]})});
  if(res.status===429)throw new Error("Limit reached – wait a moment");
  if(!res.ok)throw new Error("HTTP "+res.status);
  const d=await res.json();return((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"").trim();
}
function parseJSON(txt){const c=txt.replace(/```json|```/g,"").trim();return JSON.parse(c.slice(c.indexOf("{"),c.lastIndexOf("}")+1))}
async function claudeJSON(prompt){
  try{return parseJSON(await claude(SYS_JSON,prompt))}
  catch(e){if(/key|not set up/i.test(e.message))throw e;return parseJSON(await claude(SYS_JSON,prompt+"\n\nIMPORTANT: Keep it very short so the JSON is complete."))}
}

Judge strictly but fairly. Equivalent alternatives are correct (other fitting words, other correct word order, Austrian variants, missing final punctuation). A small typo that doesn't create a different word or form counts as correct with a note. Wrong endings, wrong case, wrong gender, wrong verb forms or wrong word order (verb position!) are wrong. In German answers, a wrongly capitalised noun counts as correct but must be mentioned.${ex.s?" In this task umlauts are tested on purpose – a/ä, o/ö, u/ü mix-ups are wrong.":""}

Previous results: ${hist}
Repetitions: ${s.reps}, lapses: ${s.lapses}
Mistakes this round:
${errs}
The spaced-repetition algorithm suggests the next review in ${baseDays} day(s).

Decide as her teacher when this topic should come back: shaky things sooner (1–2 days), solid things later. Deviate from the suggestion if mistakes or history suggest it.
JSON: {"feedback":"2–3 sentences of honest, personal feedback in English, explain the mistakes concretely","tips":["up to 3 short, concrete tips"],"intervalDays": integer 1–180,"reason":"1 short sentence why this interval"}`;

function progressSummary(){
  const L=[];
  L.push(`Started: ${new Date(S.created).toLocaleDateString("en-GB")} | streak: ${streakNow()} days | sessions: ${S.stats.sessions} | card reviews: ${S.stats.reviews}`);
  L.push("\nTOPICS:");
  if(!TOPICS.length)L.push("- none yet (lesson packages follow after the placement test)");
  TOPICS.forEach(t=>{const s=S.topics[t.id];
    if(s.status==="learning")L.push(`- ${t.id} ${t.title}: last ${pct(s.last)}, best ${pct(s.best)}, reps ${s.reps}, lapses ${s.lapses}, next ${fmtDate(s.due)}, history ${s.hist.slice(-5).map(h=>h.sc+"%").join(" → ")}`);
    else L.push(`- ${t.id} ${t.title}: ${s.status==="new"?"unlocked, not studied yet":"locked"}`)});
  const all=Object.entries(S.cards).filter(([id])=>cardWord(id)), seen=all.filter(([,c])=>!c.isNew);
  L.push(`\nVOCABULARY: ${all.length/2} words (${all.length} cards), ${learnedWords()} words started, ${solidWords()} solid in both directions`);
  const weak=weakCards().slice(0,15).map(([id,c])=>{const w=cardWord(id);return`${w[0]} (${w[1]}) ${cardDir(id)==="de"?"DE→EN":"EN→DE"} – forgotten ${c.lapses}×`});
  if(weak.length)L.push("Difficult words: "+weak.join("; "));
  const er=S.errors.slice(0,20);
  if(er.length){L.push("\nRECENT MISTAKES:");er.forEach(e=>L.push(`- [${e.topic}] ${e.q} → "${e.user}" (correct: ${e.exp})`))}
  return L.join("\n");
}

async function aiGlobal(){

${progressSummary()}
${pa?`\nPLACEMENT TEST RESULT: level ${pa.level}. Weaknesses: ${(pa.weaknesses||[]).join("; ")}`:""}

async function runGlobal(silent){
  if(GLOBAL_RUNNING)return; if(!aiReady()){if(!silent)toast("Coach isn't set up yet – see Progress → Cloud & AI");return}
  if(!TOPICS.some(t=>S.topics[t.id].status==="learning")){if(!silent)toast("Study a topic first");return}
  GLOBAL_RUNNING=true; if(!silent){const b=$("#globalbox");if(b)b.innerHTML=`<p class="muted">Coach is analysing your progress ${dots()}</p>`}
  try{
    const j=await aiGlobal();
    (j.reschedule||[]).forEach(r=>{const s=S.topics[r.topicId];const d=clampInt(r.days,1,180);
      if(s&&s.status==="learning"&&d){s.due=addDays(d);s.interval=d;s.ai={...(s.ai||{}),reason:"Overall review: "+(r.reason||"")}}});
    S.reports.unshift({d:Date.now(),...j}); S.reports=S.reports.slice(0,10);
    S.lastGlobal=Date.now(); S.sinceGlobal=0; save();
    if(!SESSION&&(CUR.tab==="today"||CUR.tab==="progress"))render();
    toast("Coach updated your study plan");
  }catch(e){GLOBAL_FAILED_AT=Date.now();if(!silent){toast("Coach can't be reached right now – try again later");render()}}
  GLOBAL_RUNNING=false;
}
let GLOBAL_FAILED_AT=0;
function maybeAutoGlobal(){
  if(!aiReady()||GLOBAL_RUNNING||Date.now()-GLOBAL_FAILED_AT<30*60000)return;
  const stale=Date.now()-S.lastGlobal>3*DAY;
  if(S.sinceGlobal>=3||(stale&&S.sinceGlobal>=1))runGlobal(true);
}

function authErr(m){
  if(/invalid login|invalid_credentials/i.test(m))return"Email or password is wrong.";
  if(/already registered|already exists/i.test(m))return"This email is already registered – please use \"Sign in\".";
  if(/not confirmed/i.test(m))return"Please open the confirmation email from Supabase first, then tap \"Sign in\".";
  if(/failed to fetch|networkerror|load failed/i.test(m))return"No connection. Is the Project URL right and are you online?";
  if(/invalid path/i.test(m))return"The Project URL looks wrong – it should end with .supabase.co";
  if(/api key|apikey|jwt/i.test(m))return"The key doesn't match. Use the publishable or anon public key (never the secret one).";
  return"Error: "+m;
}

/* Übungstypen: mc, gap, tr (dir "en" = Englisch → Deutsch, dir "de" = Deutsch → Englisch), ord */
function promptText(ex){return ex.t==="mc"?ex.q:ex.t==="gap"?ex.q+(ex.h?` (${ex.h})`:""):ex.t==="ord"?ex.en||ex.de:ex.q}
function expectedText(ex){return ex.t==="mc"?ex.o[ex.a]:ex.t==="gap"?ex.q.replace("___",ex.a[0]):ex.t==="ord"?ex.a:ex.a[0]}
function answerIsGerman(ex){return ex.t==="gap"||ex.t==="ord"||(ex.t==="tr"&&ex.dir==="en")}
function startSession(id,mode){
  const t=T(id),all=shuffle(t.ex.map((_,i)=>i));
  const idxs=mode==="learn"?all:all.slice(0,Math.min(8,all.length));
  S.active={id,mode,idxs,idx:0,results:[],d:Date.now()};save();
  openSession();
}
function openSession(){
  const a=S.active,t=a&&T(a.id);if(!t){S.active=null;save();return render()}
  SESSION={kind:"topic",id:a.id,mode:a.mode,items:a.idxs.map(i=>t.ex[i]).filter(Boolean),idx:a.idx,results:(a.results||[]).slice(),locked:false,cur:null};
  CUR={tab:"topics",arg:a.id};setTab("topics");scrollTo(0,0);
  if(SESSION.idx>=SESSION.items.length)finishTopic();else renderEx();
}
function renderEx(){
  const se=SESSION,ex=se.items[se.idx];se.locked=false;
  let h=`<div class="sbar"><div class="prog"><i style="width:${se.idx/se.items.length*100}%"></i></div><small>${se.idx+1}/${se.items.length}</small><button class="xbtn" data-act="abort">Stop</button></div><div class="card">`;
  if(ex.t==="mc"){se.cur={opts:shuffle(ex.o.map((o,i)=>({o,ok:i===ex.a})))};
    h+=`<div class="ask">Choose the right answer</div><div class="q">${esc(ex.q)}</div><div class="opts">${se.cur.opts.map((o,i)=>`<button class="opt" data-act="mc" data-id="${i}">${esc(o.o)}</button>`).join("")}</div><div class="btnrow"><button class="btn ghost" data-act="dunno">I don't know</button></div>`;}
  else if(ex.t==="gap"){
    h+=`<div class="ask">Fill the gap</div><div class="q">${esc(ex.q).replace("___",'<span class="gap">&nbsp;?&nbsp;</span>')}</div>${ex.h?`<div class="hint">${esc(ex.h)}</div>`:""}${umlautKeys()}<input id="ans" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer"><div class="btnrow"><button class="btn ghost" data-act="dunno">I don't know</button><button class="btn" data-act="check">Check</button></div>`;}
  else if(ex.t==="tr"){
    h+=`<div class="ask">${ex.dir==="en"?"Translate into German":"Translate into English"}</div><div class="q">${ex.dir==="de"?spk(ex.q):""}${esc(ex.q)}</div>${ex.dir==="en"?umlautKeys():""}<input id="ans" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${ex.dir==="en"?"In German …":"In English …"}"><div class="btnrow"><button class="btn ghost" data-act="dunno">I don't know</button><button class="btn" data-act="check">Check</button></div>`;}
  else if(ex.t==="ord"){se.cur={chips:shuffle(ex.w),picked:[]};
    h+=`<div class="ask">Build the German sentence</div><div class="q">${esc(ex.en||ex.de||"")}</div><div id="ordarea"></div><div class="btnrow"><button class="btn ghost" data-act="dunno">I don't know</button><button class="btn" data-act="check">Check</button></div>`;}
  h+=`<div id="fb"></div></div>`;
  app().innerHTML=h;
  if(ex.t==="ord")renderOrd();
  const a=$("#ans");if(a)a.focus();
}
function umlautKeys(){return`<div class="keys" aria-label="Insert special characters">${["ä","ö","ü","ß"].map(c=>`<button type="button" data-ch="${c}">${c}</button>`).join("")}</div>`}
function renderOrd(){const c=SESSION.cur,box=$("#ordarea");if(!box)return;const lock=SESSION.locked;
  box.innerHTML=`<div class="ordline">${c.picked.length?c.picked.map((ci,pi)=>`<button class="chip on" ${lock?"disabled":`data-act="unpick" data-id="${pi}"`}>${esc(c.chips[ci])}</button>`).join(""):'<span class="ph">Tap the words in the right order</span>'}</div><div class="chips">${c.chips.map((w,i)=>c.picked.includes(i)?`<span class="chip ghost">${esc(w)}</span>`:`<button class="chip" ${lock?"disabled":`data-act="pick" data-id="${i}"`}>${esc(w)}</button>`).join("")}</div>`}

function localCheck(user,acc,strict){
  const u=norm(user);
  const hit=acc.find(a=>norm(a)===u);
  if(hit!=null){
    const capsOff=String(hit).trim().replace(/[.!?]+$/,"")!==String(user).trim().replace(/[.!?]+$/,"")&&String(hit).toLowerCase().trim().replace(/[.!?]+$/,"")===String(user).toLowerCase().trim().replace(/[.!?]+$/,"");
    return capsOff&&/[A-ZÄÖÜ]/.test(String(hit).slice(1))?{correct:true,note:"Watch the capital letters (German nouns are capitalised). Correct: "+hit}:{correct:true};
  }
  if(!strict&&acc.some(a=>loose(a)===loose(user)))return{correct:true,note:"Almost perfect – watch the umlauts / ß. Correct: "+acc[0]};
  return{correct:false};
}
function answerMC(i){
  const se=SESSION;if(se.locked)return;se.locked=true;
  const ex=se.items[se.idx],o=se.cur.opts[i];
  document.querySelectorAll('[data-act="dunno"]').forEach(b=>b.style.display="none");
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(se.cur.opts[j].ok)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
  const res={correct:o.ok,note:ex.x||""};record(ex,o.o,res);showFb(res,ex);
}
async function checkAnswer(){
  const se=SESSION;if(!se||se.locked)return;const ex=se.items[se.idx];
  let user,acc;
  if(ex.t==="ord"){if(!se.cur.picked.length)return;user=se.cur.picked.map(i=>se.cur.chips[i]).join(" ");acc=[ex.a]}
  else{user=($("#ans").value||"").trim();if(!user)return;acc=ex.t==="gap"?[...ex.a,...ex.a.map(a=>ex.q.replace("___",a))]:ex.a}
  se.locked=true;const inp=$("#ans");if(inp)inp.disabled=true;if(ex.t==="ord")renderOrd();
  document.querySelectorAll('[data-act="check"],[data-act="dunno"]').forEach(b=>b.style.display="none");
  let res=localCheck(user,acc,!!ex.s);
  if(!res.correct&&ex.t!=="ord"&&aiReady()){
    $("#fb").innerHTML=`<div class="fb wait">Coach is checking your answer ${dots()}</div>`;
    try{const j=await aiJudge(ex,user);res={correct:!!j.correct,ai:j.feedback,correction:j.correction}}
    catch(e){res={correct:false,offline:true}}
  }
  if(SESSION!==se)return;
  record(ex,user,res);showFb(res,ex);
}
function dunno(){
  const se=SESSION;if(!se||se.kind!=="topic"||se.locked)return;se.locked=true;const ex=se.items[se.idx];
  const inp=$("#ans");if(inp)inp.disabled=true;
  if(ex.t==="mc")document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(se.cur.opts[j].ok)b.classList.add("right")});
  if(ex.t==="ord")renderOrd();
  document.querySelectorAll('[data-act="check"],[data-act="dunno"]').forEach(b=>b.style.display="none");
  const res={correct:false,dunno:true,note:ex.x||""};record(ex,"(I don't know)",res);showFb(res,ex);
}
function record(ex,user,res){
  const se=SESSION,q=promptText(ex),exp=res.correction||expectedText(ex);
  se.results.push({q,user,exp,correct:res.correct});
  if(!res.correct){S.errors.unshift({d:Date.now(),topic:se.id,q,user,exp});S.errors=S.errors.slice(0,80)}
  if(S.active&&S.active.id===se.id){S.active.idx=se.idx+1;S.active.results=se.results.slice()}
  save();
}
function showFb(res,ex){
  const exp=res.correction||expectedText(ex);
  let h=`<div class="fb ${res.correct?"ok":res.dunno?"dunno":"bad"}"><b class="t">${res.correct?"Richtig! Correct.":res.dunno?"No problem – here's the solution.":"Leider falsch – not quite."}</b>`;
  const de=answerIsGerman(ex);
  if(!res.correct)h+=`<p>Correct: ${de?spk(exp):""}<b>${esc(exp)}</b></p>`;
  else if(de)h+=`<p>${spk(exp)}${esc(exp)}</p>`;
  if(res.note)h+=`<p>${esc(res.note)}</p>`;
  if(res.ai)h+=`<p>${esc(res.ai)}</p>`;
  if(res.offline)h+=`<p class="muted">Coach couldn't be reached, so your answer was only compared with the model solution.</p>`;
  h+=`</div><div class="btnrow"><button class="btn" data-act="next" id="nextbtn">Next</button></div>`;
  $("#fb").innerHTML=h;if(de&&S.settings.autoplay)speak(exp);const n=$("#nextbtn");if(n)n.focus();
}

function finishTopic(){
  const se=SESSION,t=T(se.id),res=se.results,ok=res.filter(r=>r.correct).length,score=res.length?ok/res.length:0;se.score=score;
  const wrong=res.filter(r=>!r.correct);
  let h=`<div class="card center"><div class="label">${esc(t.title)}</div><div class="ring" style="--p:${Math.round(score*100)}"><span>${Math.round(score*100)}%</span></div><p>${ok} of ${res.length} correct</p></div>`;
  if(wrong.length)h+=`<div class="card"><h3 style="margin-top:0">What went wrong</h3>${wrong.map(r=>`<div class="err"><div>${esc(r.q)}</div><div class="u">Your answer: ${esc(r.user)}</div><div class="r">Correct: ${esc(r.exp)}</div></div>`).join("")}</div>`;
  if(se.mode==="extra"){bumpStreak();S.stats.sessions++;S.active=null;save();SESSION=null;
    h+=`<button class="btn" data-act="topic" data-id="${t.id}">Back to the topic</button>`;}
  else h+=`<div class="card" id="ratebox"><h3 style="margin-top:0">How confident do you feel?</h3><p class="muted">Your rating and your score go into the plan. Then Coach decides when the topic comes back.</p><div class="rates">${RATINGS.map(r=>`<button class="rate ${r.k}" data-act="rate" data-id="${r.k}"><b>${r.l}</b><small>${r.de}</small></button>`).join("")}</div></div>`;
  app().innerHTML=h;scrollTo(0,0);
}
async function rateTopic(k){
  const se=SESSION;if(!se||se.rated)return;se.rated=true;
  const t=T(se.id),s=S.topics[se.id],score=se.score;
  let q=RQ[k];if(score<0.6)q=Math.min(q,2);else if(score<0.8)q=Math.min(q,3);
  const base=sm2Next(s,q),baseDays=Math.max(1,base.interval);
  s.ease=base.ease;s.reps=base.reps;s.lapses=base.lapses;
  s.last=score;s.best=Math.max(s.best||0,score);
  s.hist.push({d:Date.now(),sc:Math.round(score*100),r:k});s.hist=s.hist.slice(-30);
  const wasNew=s.status==="new";
  if(wasNew){s.status="learning";addCards(t);S.daily.newTopics++}
  s.interval=baseDays;s.due=addDays(baseDays);s.ai={...(s.ai||{}),reason:"Plan from the algorithm"};
  bumpStreak();S.stats.sessions++;S.sinceGlobal++;S.active=null;
  const opened=refreshUnlocks();save();
  const unl=opened.length?`<div class="card" style="border-color:var(--kuusi)"><b style="color:var(--kuusi)">Newly unlocked:</b> ${opened.map(o=>esc(o.title)).join(", ")}</div>`:"";
  const words=wasNew?`<p class="muted">${t.v.length} new words (${t.v.length*2} cards, both directions) are waiting under Words.</p>`:"";
  const box=$("#ratebox");
  const tail=`${unl}<div class="btnrow"><button class="btn" data-act="tab" data-id="today">Continue</button></div>`;
  if(!aiReady()){box.innerHTML=`<div class="plan" style="border:0;margin:0;padding:0">Next review: <b>${relDays(s.due)}</b> (${fmtDate(s.due)})</div>${words}`;box.insertAdjacentHTML("afterend",tail);SESSION=null;return}
  box.innerHTML=`<p class="muted">Coach is reviewing your round ${dots()}</p>`;
  try{
    const j=await aiSessionReview(t,s,se.results,score,k,baseDays);
    const d=clampInt(j.intervalDays,1,180)||baseDays;
    s.interval=d;s.due=addDays(d);s.ai={feedback:j.feedback,tips:j.tips||[],reason:j.reason||"",date:Date.now()};save();
    box.classList.add("aibox");
    box.innerHTML=`<div class="label">Coach</div><p>${esc(j.feedback)}</p>${(j.tips||[]).length?`<ul>${j.tips.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}<div class="plan">Next review: <b>${relDays(s.due)}</b> (${fmtDate(s.due)})<br><small>${esc(j.reason||"")}</small></div>${words}`;
  }catch(e){
    box.innerHTML=`<div class="plan" style="border:0;margin:0;padding:0">Next review: <b>${relDays(s.due)}</b> (${fmtDate(s.due)})<br><small>Coach couldn't be reached, so the standard plan applies.</small></div>${words}`;
  }
  box.insertAdjacentHTML("afterend",tail);SESSION=null;
}

/* ============================================================
   EINSTUFUNGSTEST (Placement test)
   Speicherung in S.placement = {a: Antworten, u: unsicher, c: geprüft/gesperrt, ...}
   Gleiche Struktur wie im Claude-Testblatt → Antworten lassen sich importieren.
   ============================================================ */
const PT_BUSY=new Set();
const PT_NOTES={};
const LETTER_END=/([A-Za-zÄÖÜäöüß]+)$/;
const EMPTY_MARKS=["-","–","—","0","/","x","ø"];
function ptAll(){const out=[];PT.forEach(part=>part.sections.forEach(sec=>sec.items.forEach((item,i)=>out.push({id:sec.id+"."+(i+1),item,sec,part}))));return out}
function ptFind(id){return ptAll().find(x=>x.id===id)}
function ptSec(id){for(const p of PT)for(const s of p.sections)if(s.id===id)return s;return null}
function gapStems(item){return item.t.split("___").slice(0,-1).map(p=>{const m=p.match(LETTER_END);return m?m[1]:""})}
function gapCount(item){return item.t.split("___").length-1}
function normGap(v){return(v||"").trim().replace(/\s+/g," ").replace(/[.,!?]+$/,"").toLowerCase()}
function normSent(v){let x=(v||"").replace(/[„“”"«»]/g,"").replace(/…|\.\.\./g,"").replace(/,/g," ").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();return x?x.charAt(0).toLowerCase()+x.slice(1):x}
function gapOk(item,i,val){
  const v=normGap(val);if(!v)return false;
  const stem=gapStems(item)[i].toLowerCase();
  return item.s[i].split("|").some(alt=>{const a=alt.toLowerCase();
    if(stem){if(a==="")return EMPTY_MARKS.includes(v)||v===stem;return v===a||v===stem+a}
    return v===a});
}
function fullGapWord(item,i,val){const stem=gapStems(item)[i],v=(val||"").trim();if(!stem)return v;if(EMPTY_MARKS.includes(v))return stem;if(v.toLowerCase().startsWith(stem.toLowerCase()))return v;return stem+v}
function filledSentence(item,vals){const parts=item.t.split("___"),stems=gapStems(item);let out="";parts.forEach((txt,i)=>{if(i<parts.length-1)out+=txt.slice(0,txt.length-stems[i].length)+"["+fullGapWord(item,i,vals[i])+"]";else out+=txt});return out}
function solutionSentence(item){const parts=item.t.split("___");return parts.map((txt,i)=>i<parts.length-1?txt+item.s[i].split("|")[0]:txt).join("")}
function sentOk(item,val){const v=normSent(val);return !!v&&item.s.some(alt=>normSent(alt)===v)}
function ptAnswered(item,id){const v=S.placement.a[id];
  if(item.k==="b"){const n=gapCount(item);return Array.isArray(v)&&v.length>=n&&v.slice(0,n).every(x=>x&&String(x).trim())}
  return typeof v==="string"&&v.trim().length>0}
function fmtVal(item,v){
  if(item.k==="b"){const arr=Array.isArray(v)?v:[],out=[];for(let i=0;i<gapCount(item);i++)out.push((arr[i]||"").trim()||"—");return out.join(" … ")}
  return(typeof v==="string"&&v.trim())?v.trim():"—"}
function ptFmt(item,id){return fmtVal(item,S.placement.a[id])}
function modelText(item){if(item.m)return item.m;if(item.k==="rf")return item.s;if(item.k==="r")return item.s[0];if(item.k==="b")return solutionSentence(item);return""}
function isText(item){return item.k==="r"||item.k==="s"}
function ptStats(){let total=0,answered=0,checked=0,right=0,graded=0;
  ptAll().forEach(({id,item})=>{total++;if(ptAnswered(item,id))answered++;const c=S.placement.c[id];if(c){checked++;if(item.k!=="w"&&c.r!=="pending"){graded++;if(["ok","self","self-ok"].includes(c.r))right++}}});
  return{total,answered,checked,right,graded}}

/* Wortvergleich für grün/rot */
function toks(s){return(s||"").trim().split(/\s+/).filter(Boolean)}
function wkey(w){return w.replace(/[„“”"«».,!?;:()–]/g,"")}
function lcsMask(a,b){
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=wkey(a[i])===wkey(b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ma=new Array(n).fill(false),mb=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(wkey(a[i])===wkey(b[j])){ma[i]=mb[j]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return{ma,mb,len:dp[0][0]};
}
function bestModel(item,ans){const alts=item.m?[item.m]:(item.s||[]);let best=alts[0]||"",sc=-1;alts.forEach(alt=>{const l=lcsMask(toks(ans),toks(alt)).len;if(l>sc){sc=l;best=alt}});return best}
function markedHTML(text,ref,allOk){const a=toks(text),mask=allOk?a.map(()=>true):lcsMask(a,toks(ref)).ma;return a.map((w,i)=>`<span class="pw ${mask[i]?"ok":"bad"}">${esc(w)}</span>`).join(" ")}
function correctionHTML(corr,ans){const b=toks(corr),mb=lcsMask(toks(ans),b).mb;return b.map((w,i)=>mb[i]?esc(w):`<b>${esc(w)}</b>`).join(" ")}

function localGrade(item,v){
  if(item.k==="b"){const per=item.s.map((_,i)=>gapOk(item,i,(Array.isArray(v)?v[i]:"")||""));return{res:per.every(Boolean)?"ok":"wrong",per}}
  if(item.k==="r"&&!item.m)return{res:sentOk(item,v)?"ok":"wrong"};
  if(item.k==="rf")return{res:v===item.s?"ok":"wrong"};
  return{res:"pending"};
}

async function ptCheckSection(secId){
  const sec=ptSec(secId);if(!sec)return;
  const P=S.placement,toAI=[],toWrite=[];
  if(!P.started)P.started=Date.now();
  sec.items.forEach((item,i)=>{
    const id=sec.id+"."+(i+1);if(PT_BUSY.has(id))return;
    let c=P.c[id];
    if(!c){
      if(!ptAnswered(item,id))return;
      const raw=JSON.parse(JSON.stringify(P.a[id]));
      c=P.c[id]={first:ptFmt(item,id),raw,t:Date.now()};
      if(item.k==="w"){c.r="fb";toWrite.push(id);return}
      const g=localGrade(item,raw);c.r=g.res;
      if(item.k==="b")c.gaps=g.per;
      if(item.k==="rf"||g.res==="ok")c.g=true;else toAI.push(id);
    }else if(!c.g&&item.k==="w"){toWrite.push(id)}
    else if(!c.g&&c.r!=="ok"&&item.k!=="rf")toAI.push(id);
  });
  save();
  if(!toAI.length&&!toWrite.length){ptRerender();return}
  if(!aiReady()){PT_NOTES[secId]=toWrite.length&&!toAI.length?"Submitted. Claude will correct your text when you send the report.":"Coach isn't set up, so answers are compared with the model solution. Set up a free Gemini key under Progress → Cloud & AI for smarter checking.";ptRerender();return}
  [...toAI,...toWrite].forEach(id=>PT_BUSY.add(id));PT_NOTES[secId]="";ptRerender();
  try{
    if(toAI.length)await ptAIGrade(sec,toAI);
    for(const id of toWrite)await ptAIWriting(id);
  }catch(e){PT_NOTES[secId]="Coach couldn't be reached. Tap “Check section” again later – your answers are saved and locked.";}
  [...toAI,...toWrite].forEach(id=>PT_BUSY.delete(id));
  save();ptRerender();
}

async function ptAIGrade(sec,ids){
  const P=S.placement;
  const tasks=ids.map(id=>{const {item}=ptFind(id),c=P.c[id];
    if(item.k==="b"){const vals=Array.isArray(c.raw)?c.raw:(P.a[id]||[]);return{id,type:"gap sentence",task:item.t+(item.tag?" ["+item.tag+"]":""),answer:filledSentence(item,vals),model:solutionSentence(item)}}
    return{id,type:item.m?"free answer":"rewrite sentence",instruction:[sec.hint,item.tag].filter(Boolean).join(" – "),task:item.t,model:item.m||item.s.join(" | "),answer:c.first}});
  const prompt=`Check Aurora's answers from her German placement test (B1). Judge fairly:
- An answer is correct if it is grammatically correct, sounds natural and fulfils the task (e.g. the required tense, same content). It does NOT have to match the model answer word for word. Other correct word orders, synonyms and Austrian variants are correct.
- Spelling, capitalisation, umlauts and endings count. A missing full stop at the end and missing commas are not mistakes.
- "rewrite sentence": if she only wrote the subordinate clause / the new part, that's fine if that part is correct.
- "gap sentence": her words are in [square brackets]. Judge each gap separately in "gaps" (true/false, same order). A gap is correct if the sentence is correct with it and fulfils the task (respect hints in brackets). "correction" is the full corrected sentence without brackets.
- "free answer": appropriate content and correct German; small style questions are not mistakes.
- "correction": her answer corrected with as FEW changes as possible – do not just copy the model answer. If correct: her answer unchanged.
- "explanation": if wrong, in ENGLISH, max. 2 short sentences: what is wrong and which rule applies (German example words are fine). If correct: "".
${sec.reading?"\nReading text:\n"+PT_READING.join("\n")+"\n":""}
Tasks:
${JSON.stringify(tasks,null,1)}

JSON: {"results":[{"id":"…","correct":true,"gaps":[true],"correction":"…","explanation":""}]}`;
  const out=await claudeJSON(prompt);
  const list=out&&Array.isArray(out.results)?out.results:[];
  if(!list.length)throw new Error("empty");
  list.forEach(r=>{
    if(!r||!ids.includes(r.id))return;
    const c=P.c[r.id],{item}=ptFind(r.id),right=r.correct===true;
    c.g=true;c.r=right?"ok":"wrong";
    c.corr=typeof r.correction==="string"?r.correction.trim():"";
    c.expl=right?"":(typeof r.explanation==="string"?r.explanation.trim():"");
    if(item.k==="b"){const n=gapCount(item);if(right)c.gaps=new Array(n).fill(true);else if(Array.isArray(r.gaps)&&r.gaps.length===n)c.gaps=r.gaps.map(x=>x===true)}
  });
}

async function ptAIWriting(id){
  const {item}=ptFind(id),c=S.placement.c[id];
  const prompt=`Aurora (German B1, aiming for B2) wrote this text for her placement test.
Task: ${item.t}
${(item.points||[]).map(p=>"- "+p).join("\n")}
Target length: ${item.min}–${item.max} words.

Her text:
"""${c.first}"""

Correct it like a supportive teacher. Keep her style; only fix real mistakes.
JSON: {"corrected":"her full text, corrected with as few changes as possible","mistakes":[{"wrong":"short wrong phrase","right":"corrected phrase","why":"short English explanation, name the rule"}],"level":"estimated CEFR level of this text, e.g. B1","comment":"2 sentences in English: what she does well and the most important thing to improve"}
List at most 8 of the most important mistakes.`;
  const j=await claudeJSON(prompt);
  c.g=true;c.corr=typeof j.corrected==="string"?j.corrected.trim():"";
  c.mistakes=Array.isArray(j.mistakes)?j.mistakes.slice(0,8):[];c.wlevel=j.level||"";c.comment=j.comment||"";
}

function ptResultHTML(id,item,c){
  if(PT_BUSY.has(id))return`<div class="pres wait"><span class="lbl">Checking</span>${dots()}</div>`;
  if(item.k==="w"){
    if(!c.g)return`<div class="pres wait"><span class="lbl">Submitted.</span>Claude will correct this text when you send your report${aiReady()?" – or tap “Check section” again for Coach's feedback":""}.</div>`;
    return`<div class="pres ok"><div><span class="lbl">Corrected version</span>${c.wlevel?`<span class="badge">${esc(c.wlevel)}</span>`:""}</div><div class="sol" style="margin-top:6px;line-height:1.7">${correctionHTML(c.corr||c.first,c.first)}</div>${(c.mistakes||[]).length?`<ul>${c.mistakes.map(m=>`<li><span style="color:var(--puolukka)">${esc(m.wrong)}</span> → <b style="color:var(--kuusi)">${esc(m.right)}</b>. ${esc(m.why)}</li>`).join("")}</ul>`:""}${c.comment?`<p class="sub">${esc(c.comment)}</p>`:""}</div>`;
  }
  const right=["ok","self","self-ok"].includes(c.r);
  if(right){
    let h=`<div class="pres ok"><span class="lbl">${c.r==="ok"?"Correct ✓":"Correct (self-assessed)"}</span>`;
    if(isText(item)&&!(item.k==="r"&&!item.m&&sentOk(item,c.first)))h+=`<div class="sub">Model answer: ${esc(modelText(item))}</div>`;
    if(item.k==="b"&&c.g&&!localGrade(item,Array.isArray(c.raw)?c.raw:S.placement.a[id]).per.every(Boolean))h+=`<div class="sub">Also possible: ${esc(solutionSentence(item))}</div>`;
    return h+"</div>";
  }
  if(c.r==="pending")return`<div class="pres wait"><div><span class="lbl">Model answer:</span>${esc(modelText(item))}</div><div class="sub">Compare yourself: is your version correct too?</div><div class="selfrow"><button class="btn sm ghost" data-act="ptself" data-id="${id}|self-ok">Mine is correct</button><button class="btn sm ghost" data-act="ptself" data-id="${id}|self-bad">I made mistakes</button></div></div>`;
  let h=`<div class="pres bad">`;
  if(item.k==="b"){const parts=item.t.split("___");h+=`<div><span class="lbl">Solution:</span><span class="sol">${parts.map((txt,i)=>esc(txt)+(i<parts.length-1?`<b>${esc(item.s[i].split("|")[0])}</b>`:"")).join("")}</span></div>`}
  else if(item.k==="rf")h+=`<div><span class="lbl">Solution:</span>${esc(item.s)}</div>`;
  else if(c.g&&c.corr){h+=`<div><span class="lbl">Correction:</span><span class="sol">${correctionHTML(c.corr,c.first)}</span></div>`;if(normSent(c.corr)!==normSent(modelText(item)))h+=`<div class="sub">Model answer: ${esc(modelText(item))}</div>`}
  else{h+=`<div><span class="lbl">Solution:</span><span class="sol">${esc(bestModel(item,c.first))}</span></div>`;if(item.k==="r"&&!c.g)h+=`<div class="selfrow"><button class="btn sm ghost" data-act="ptself" data-id="${id}|self">My version is correct too</button></div>`}
  if(c.expl)h+=`<p class="sub" style="color:var(--yo)">${esc(c.expl)}</p>`;
  return h+"</div>";
}

function ptItemHTML(id,item,n){
  const P=S.placement,c=P.c[id],v=P.a[id],busy=PT_BUSY.has(id),locked=!!c;
  let body="";
  if(item.k==="b"){
    const parts=item.t.split("___"),vals=locked&&Array.isArray(c.raw)?c.raw:(Array.isArray(v)?v:[]);
    const per=locked&&!busy?(c.gaps||localGrade(item,vals).per):null;
    body=`<p class="psent gaps">${parts.map((txt,i)=>{if(i>=parts.length-1)return esc(txt);const base=LETTER_END.test(txt)?3.5:8,val=vals[i]||"";
      return esc(txt)+`<input class="pgap${per?(per[i]?" ok":" bad"):""}" data-pid="${id}" data-gi="${i}" value="${esc(val)}" style="width:${Math.max(base,val.length+1.5)}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Gap ${i+1}" ${locked?"readonly":""}>`}).join("")}${item.tag?`<span class="ptag">${esc(item.tag)}</span>`:""}</p>`;
  }else if(item.k==="rf"){
    const right=locked&&["ok"].includes(c.r);
    body=`<p class="psent">${esc(item.t)}</p><div class="rfrow">${["richtig","falsch"].map(o=>`<button class="${v===o?(locked&&!busy?(right?"ok":"bad"):"on"):""}" ${locked?"disabled":`data-act="ptrf" data-id="${id}|${o}"`}>${o}</button>`).join("")}</div>`;
  }else{
    body=`<p class="psent">${esc(item.t)}${item.tag?`<span class="ptag">${esc(item.tag)}</span>`:""}</p>`;
    if(item.points)body+=`<ul style="margin:4px 0 10px;padding-left:20px">${item.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`;
    if(locked){
      const right=["ok","self","self-ok"].includes(c.r);
      if(busy||item.k==="w"||c.r==="pending")body+=`<div class="mine">${esc(c.first)}</div>`;
      else{const ref=c.g?(c.corr||c.first):bestModel(item,c.first);body+=`<div class="mine">${markedHTML(c.first,ref,right)}</div>`}
    }else if(item.k==="w"){
      const words=((v||"").trim().match(/\S+/g)||[]).length;
      body+=`<textarea class="plong" data-pid="${id}" spellcheck="false" aria-label="Your text">${esc(v||"")}</textarea><div class="wc${words>=item.min&&words<=item.max?" ok":""}" id="wc-${id.replace(".","-")}">${words} words (target: ${item.min}–${item.max})</div>`;
    }else{
      body+=`<textarea class="${item.k==="s"?"plong pshort":"pline"}" rows="1" data-pid="${id}" spellcheck="false" autocomplete="off" aria-label="Your answer">${esc(v||"")}</textarea>`;
    }
  }
  if(locked)body+=ptResultHTML(id,item,c);
  const u=item.k==="w"?"<span></span>":`<button class="unsure${P.u[id]?" on":""}" ${locked?"disabled":`data-act="ptu" data-id="${id}"`} title="Unsure / guessed" aria-label="Mark as unsure">?</button>`;
  return`<div class="pitem"><span class="n">${n}</span><div>${body}</div>${u}</div>`;
}

function ptPartCounts(part){let t=0,a=0;part.sections.forEach(sec=>sec.items.forEach((it,i)=>{t++;if(ptAnswered(it,sec.id+"."+(i+1)))a++}));return{t,a}}

  h+=`<div class="card"><h2 style="margin:0">Part ${part.id}: ${esc(part.name)}</h2><p class="muted" style="margin:2px 0 8px">${esc(part.time)}</p>${umlautKeys()}`;
  part.sections.forEach(sec=>{
    h+=`<div class="psec" style="margin-top:22px"><h3><span class="code">${sec.id}</span>${esc(sec.title)}</h3>${sec.hint?`<p class="muted">${esc(sec.hint)}</p>`:""}`;

    const isW=sec.items.every(it=>it.k==="w");
    h+=`<div class="checkrow"><button class="btn ghost" data-act="ptcheck" data-id="${sec.id}">${isW?"Submit text":"Check section"}</button>${checked?`<span class="muted"><b style="color:var(--yo)">${right} of ${checked}</b> correct</span>`:""}</div>`;
    if(PT_NOTES[sec.id])h+=`<p class="muted" style="margin-top:8px">${esc(PT_NOTES[sec.id])}</p>`;
    h+=`<p class="muted" style="font-size:13px;margin-top:6px">${isW?"After submitting, your text is locked.":"After checking, your answers in this section are locked."}</p></div>`;

  h+=`</div>`;
  const idx=PT.indexOf(part);

  if(!P.done){
    const open=st.total-st.checked;
    h+=`<div class="card" style="margin-top:14px"><div class="label">Finish the test</div><p class="muted">${open?`${open} tasks are not checked yet. You can still finish – open tasks count as not answered.`:"All tasks are checked. Finish the test to get your result."}</p><div class="btnrow"><button class="btn${open?" ghost":""}" data-act="ptfinish">${open?"Finish anyway":"Finish & get my result"}</button></div></div>`;
  }
  h+=`<div class="card"><div class="label">Ask Coach</div><p class="muted">A grammar question about a correction? Ask in English.</p><div style="display:flex;gap:8px"><input id="askq" class="inp" placeholder="e.g. Why is it „der Kollegin“ and not „die“?" autocomplete="off"><button class="btn sm" data-act="ask" data-id="pt">Ask</button></div><div id="askres"></div></div>`;
  app().innerHTML=h;
  requestAnimationFrame(()=>app().querySelectorAll("textarea.pline").forEach(ptAutosize));
}

async function ptFinish(b){
  const P=S.placement,st=ptStats();
  if(st.total-st.checked&&!b.dataset.sure){b.dataset.sure="1";b.textContent="Really finish? Tap again";return}
  P.done=true;P.doneAt=Date.now();save();
  if(aiReady()){
    b.disabled=true;b.innerHTML=`Coach is analysing ${dots()}`;
    try{
      const j=await claudeJSON(`Here are Aurora's placement test results (German, she self-reports B1; known weak spots: pronouns, tenses, cases).

${ptReport()}

Analyse like an experienced German teacher. Estimate her CEFR level (e.g. "B1-", "B1", "B1+"), and name the grammar areas she needs most (be specific, e.g. "dative after Wechselpräpositionen", "Perfekt with sein"). Keep lists to max. 4 items, max. 12 words each.
JSON: {"level":"…","summary":"2 sentences in English","strengths":["…"],"weaknesses":["…"],"focus":"1 sentence: what the first lessons should focus on"}`);
      P.analysis=j;save();
    }catch(e){toast("Coach couldn't analyse right now – your report still has everything")}
  }
  CUR={tab:"topics",arg:"pt"};render();scrollTo(0,0);toast("Placement test finished ✓");
}

function ptReport(){
  const P=S.placement,st=ptStats(),L=[];
  L.push(`PLACEMENT TEST (Einstufungstest B1) – ${P.done?"finished "+new Date(P.doneAt).toLocaleDateString("en-GB"):"in progress"}`);
  L.push(`Answered: ${st.answered}/${st.total} · checked: ${st.checked} · correct on first attempt: ${st.right}/${st.graded}`);
  L.push("Key: ✓ correct · ✗ wrong · ☆ self-assessed · (?) unsure");
  PT.forEach(part=>{
    L.push(`\n=== Part ${part.id}: ${part.name} ===`);
    part.sections.forEach(sec=>sec.items.forEach((it,i)=>{
      const id=sec.id+"."+(i+1),c=P.c[id],mark=P.u[id]?" (?)":"";
      if(it.k==="w"){
        L.push(`\n${id}: ${c?c.first:ptFmt(it,id)}`);
        if(c&&c.g){L.push(`→ Coach's correction: ${c.corr}`);(c.mistakes||[]).forEach(m=>L.push(`  - ${m.wrong} → ${m.right}: ${m.why}`));if(c.wlevel)L.push(`  Estimated level: ${c.wlevel}`)}
        return;
      }
      if(!c){L.push(`${id}: ${ptFmt(it,id)} (not checked)${mark}`);return}
      const ans=it.k==="b"&&Array.isArray(c.raw)?fmtVal(it,c.raw):c.first;
      let line=`${id}: ${ans}`;
      if(c.r==="pending")line+=" (not assessed)";
      else if(c.r==="ok")line+=" ✓";
      else if(c.r==="self"||c.r==="self-ok")line+=` ☆ self-assessed correct (model: ${modelText(it)})`;
      else if(c.r==="self-bad")line+=` ✗ self-assessed wrong (model: ${modelText(it)})`;
      else{line+=" ✗";line+=isText(it)&&c.corr?` → correction: ${c.corr}`:` → solution: ${isText(it)?bestModel(it,c.first):modelText(it)}`;if(c.expl)line+=` | ${c.expl}`}
      L.push(line+mark);
    }));
  });
  if(P.analysis){const a=P.analysis;L.push(`\nCOACH'S ANALYSIS: level ${a.level}. ${a.summary||""}\nStrengths: ${(a.strengths||[]).join("; ")}\nWeaknesses: ${(a.weaknesses||[]).join("; ")}\nFocus: ${a.focus||""}`)}
  return L.join("\n");
}

/* Import aus dem Claude-Testblatt (gleiche IDs) – überschreibt nie vorhandene Antworten */
function ptImport(txt){
  try{
    const d=JSON.parse(String(txt).replace(/```json|```/g,"").trim());
    const src=d&&d.type==="dt-placement"?d:d;
    if(!src||typeof src.a!=="object")throw 0;
    const P=S.placement,valid=new Set(ptAll().map(x=>x.id));let n=0;
    Object.keys(src.a||{}).forEach(id=>{if(!valid.has(id)||P.c[id])return;if(!ptAnswered(ptFind(id).item,id)){P.a[id]=src.a[id];n++}});
    Object.keys(src.u||{}).forEach(id=>{if(valid.has(id)&&!P.c[id]&&src.u[id])P.u[id]=true});
    Object.keys(src.c||{}).forEach(id=>{if(!valid.has(id)||P.c[id])return;const c=src.c[id];if(!c||!c.first)return;
      P.c[id]={first:c.first,raw:c.raw!==undefined?c.raw:src.a[id],r:["ok","wrong","self","self-ok","self-bad","pending"].includes(c.r)?c.r:"pending",g:!!c.g,corr:c.corr||"",expl:c.expl||"",gaps:c.gaps,t:Date.now()};
      if(src.a[id]!==undefined)P.a[id]=src.a[id];n++});
    if(!P.started)P.started=Date.now();
    save();renderPlacement();toast(n?`${n} answers imported ✓`:"Nothing new to import");
  }catch(e){toast("That doesn't look like a test export")}
}

function dl(text,name,type){const b=new Blob([text],{type}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function downloadBackup(){

  catch(e){CUR={tab:"progress",arg:null};render();showOut("#out2",txt,"Download not possible – please copy this and keep it safe")}
}
async function downloadOffline(){
  let html;

function importText(txt){
  try{const d=JSON.parse(txt);
    if(d&&(d.type==="dt-placement"||(d.a&&d.c&&!d.topics))){CUR={tab:"topics",arg:"pt"};render();return ptImport(txt)}
    if(!d||!d.topics||!d.cards)throw 0;localStorage.setItem(KEY+"-before-import",JSON.stringify(S));S=d;migrate();applyTheme();save();CUR={tab:"today",arg:null};render();toast("Backup restored ✓")}
  catch(e){toast("That isn't a valid backup")}
}

/* ---------- Lektionspakete (neue Themen ohne neue App-Version) ---------- */
function sanitizeHTML(h){return String(h||"").replace(/<\s*(script|iframe|object|embed|style)[\s\S]*?<\s*\/\s*\1\s*>/gi,"").replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,"").replace(/javascript:/gi,"")}
function validTopic(t){return t&&typeof t.id==="string"&&!t.id.includes("-")&&t.title&&Array.isArray(t.v)&&Array.isArray(t.ex)&&t.ex.length>0}
function importPack(txt){
  try{
    const d=JSON.parse(String(txt).replace(/```json|```/g,"").trim());
    if(d&&(d.type==="dt-placement"))return importText(JSON.stringify(d));
    const list=Array.isArray(d)?d:d.topics;if(!Array.isArray(list)||!list.length)throw 0;
    let n=0;
    list.forEach(t=>{if(!validTopic(t))return;
      t.th=sanitizeHTML(t.th);t.req=Array.isArray(t.req)?t.req:[];t.fi=t.fi||t.de||"";t.lvl=t.lvl||"";
      const i=S.packs.findIndex(x=>x.id===t.id);if(i>=0)S.packs[i]=t;else S.packs.push(t);n++});
    if(!n)throw 0;
    migrate();save();CUR={tab:"topics",arg:null};render();toast(n+" topics added ✓ – your progress is kept");
  }catch(e){toast("That isn't a valid lesson package")}
}

function landscape(){
  let seed=7;const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const ridge=(base,amp,step)=>{let d=`M0 44 L0 ${base}`,x=0,y=base;
    while(x<1200){const w=step*(0.6+r());const peak=base-amp*(0.35+r()*0.65);d+=` L${(x+w*0.5).toFixed(1)} ${peak.toFixed(1)} L${(x+w).toFixed(1)} ${(base-amp*0.15*r()).toFixed(1)}`;x+=w}
    return d+" L1200 44 Z"};
  $("#far").setAttribute("d",ridge(30,26,70));
  $("#near").setAttribute("d",ridge(40,20,46));
}
